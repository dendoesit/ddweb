    <script defer src="https://cloud.umami.is/script.js" data-website-id="94bdfe79-fda1-4672-8779-83c380e51863"></script>
    <script>
      document.addEventListener('click', function (e) {
        var a = e.target.closest('a[href]');
        if (!a || !window.umami) return;
        var href = a.getAttribute('href');
        var kind = href.indexOf('mailto:') === 0 ? 'email'
          : /^https?:/.test(href) && a.host !== location.host ? 'portofoliu'
          : /investors|contact/.test(href) ? 'buton'
          : null;
        if (!kind) return;
        var label = (a.getAttribute('aria-label') || a.textContent).trim().replace(/\s+/g, ' ').slice(0, 60);
        window.umami.track('ddweb-' + kind, { pagina: location.pathname, buton: label, limba: document.documentElement.lang });
      });
    </script>
